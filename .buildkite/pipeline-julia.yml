.test: &test
  timeout_in_minutes: 120
  if: build.message !~ /\[skip tests\]/
  agents:
    queue: "juliaecosystem"
    sandbox_capable: "true"
    os: linux
    arch: x86_64
  command: "julia --project -e 'using Pkg; Pkg.develop(;path=\"lib/TimespanLogging\")'"

.gputest: &gputest
  timeout_in_minutes: 60
  if: build.message !~ /\[skip tests\]/

.bench: &bench
  # Run on every pull request (gating against >25% regressions vs master), and
  # on demand elsewhere via a "[run benchmarks]" commit message. Use
  # "[skip benchmarks]" to opt a PR out.
  if: (build.pull_request.id != null && build.message !~ /\[skip benchmarks\]/) || build.message =~ /\[run benchmarks\]/
  agents:
    queue: "juliaecosystem"
    sandbox_capable: "true"
    os: linux
    arch: x86_64
    num_cpus: 16

steps:
  - label: Julia 1 (multithreaded)
    <<: *test
    plugins:
      - JuliaCI/julia#v1:
          version: "1"
      - JuliaCI/julia-coverage#v1:
          codecov: true
    command: "julia --project -e 'using Pkg; Pkg.instantiate()'; julia -t $BUILDKITE_AGENT_META_DATA_NUM_CPUS test/runtests.jl -p 0"

  - label: Julia 1.10
    <<: *test
    plugins:
      - JuliaCI/julia#v1:
          version: "1.10"
      - JuliaCI/julia-test#v1:
          julia_args: "--threads=1"
      - JuliaCI/julia-coverage#v1:
          codecov: true

  - label: Julia 1.11
    <<: *test
    plugins:
      - JuliaCI/julia#v1:
          version: "1.11"
      - JuliaCI/julia-test#v1:
          julia_args: "--threads=1"
      - JuliaCI/julia-coverage#v1:
          codecov: true

  - label: Julia 1.12
    <<: *test
    plugins:
      - JuliaCI/julia#v1:
          version: "1.12"
      - JuliaCI/julia-test#v1:
          julia_args: "--threads=1"
      - JuliaCI/julia-coverage#v1:
          codecov: true

  - label: Julia 1
    <<: *test
    plugins:
      - JuliaCI/julia#v1:
          version: "1"
      - JuliaCI/julia-test#v1:
          julia_args: "--threads=1"
      - JuliaCI/julia-coverage#v1:
          codecov: true

  - label: Julia nightly
    <<: *test
    plugins:
      - JuliaCI/julia#v1:
          version: "nightly"
      - JuliaCI/julia-test#v1:
          julia_args: "--threads=1"
      - JuliaCI/julia-coverage#v1:
          codecov: true

  - label: Julia 1 (Windows)
    <<: *test
    agents:
      queue: "juliaecosystem"
      os: windows
      arch: x86_64
    plugins:
      - JuliaCI/julia#v1:
          version: "1"
      - JuliaCI/julia-test#v1:
          julia_args: "--threads=1"
      - JuliaCI/julia-coverage#v1:
          codecov: true

  - label: Julia 1 (macOS)
    <<: *test
    agents:
      queue: "juliaecosystem"
      os: macos
      arch: x86_64
    plugins:
      - JuliaCI/julia#v1:
          version: "1"
      - JuliaCI/julia-test#v1:
          julia_args: "--threads=1"
      - JuliaCI/julia-coverage#v1:
          codecov: true

  - label: Julia 1.11 (OpenCL)
    key: test-opencl
    <<: *gputest
    timeout_in_minutes: 20
    plugins:
      - JuliaCI/julia#v1:
          version: "1.11"
      - JuliaCI/julia-test#v1:
      - JuliaCI/julia-coverage#v1:
          codecov: true
    agents:
      queue: "juliaecosystem"
      os: macos
      arch: aarch64
    env:
      CI_USE_OPENCL: "1"
    command: "julia --project -e 'using Pkg; Pkg.develop(;path=\"lib/TimespanLogging\")'"

  # MPI × OpenCL SPMD datadeps suite. Runs on the same macOS/aarch64 agent as the
  # non-MPI OpenCL job, but drives test/mpi_opencl.jl under MPI.jl's bundled
  # `mpiexec` via test/run_mpi.jl (no `julia-test` plugin, no system MPI).
  - label: Julia 1.11 (OpenCL, MPI)
    key: test-opencl-mpi
    <<: *gputest
    timeout_in_minutes: 20
    plugins:
      - JuliaCI/julia#v1:
          version: "1.11"
    agents:
      queue: "juliaecosystem"
      os: macos
      arch: aarch64
    command: |
      julia --project=test/openclenv -e 'using Pkg; Pkg.develop([PackageSpec(path=pwd()), PackageSpec(path="lib/TimespanLogging")]); Pkg.instantiate()'
      julia --project=test/openclenv test/run_mpi.jl 2 2 test/mpi_opencl.jl

  - label: Julia 1 - TimespanLogging
    <<: *test
    timeout_in_minutes: 20
    plugins:
      - JuliaCI/julia#v1:
          version: "1"
      - JuliaCI/julia-coverage#v1:
          codecov: true
    command: "julia --project -e 'using Pkg; Pkg.develop(;path=\"lib/TimespanLogging\"); Pkg.instantiate(); Pkg.test(\"TimespanLogging\")'"

  - label: Julia 1 - DaggerWebDash
    <<: *test
    timeout_in_minutes: 20
    plugins:
      - JuliaCI/julia#v1:
          version: "1"
      - JuliaCI/julia-coverage#v1:
          codecov: true
    command: "julia -e 'using Pkg; Pkg.develop([PackageSpec(path=pwd()), PackageSpec(path=\"lib/TimespanLogging\"), PackageSpec(path=\"lib/DaggerWebDash\")]); include(\"lib/DaggerWebDash/test/runtests.jl\")'"

  - label: "Benchmarks (vs master)"
    timeout_in_minutes: 120
    <<: *bench
    plugins:
      - JuliaCI/julia#v1:
          version: "1"
    command: "bash .buildkite/run_benchmarks.sh"
    env:
      JULIA_NUM_THREADS: "8"
      BENCHMARK_BASE_REV: "master"
      BENCHMARK_REGRESSION_THRESHOLD: "0.25"
      BENCHMARK_CI_THREADS: "8"
      # Keep CI runs bounded; tune as needed (see benchmark/benchmarks.jl).
      BENCHMARK_SCALE: "[1024, 4096]"
      BENCHMARK_SECONDS: "5"
      BENCHMARK_SAMPLES: "20"
      BENCHMARK_OUTPUT_DIR: "benchmark_results"
    artifacts:
      - "benchmark_results/**/*"

# env:
#   SECRET_CODECOV_TOKEN: ""

  - label: "Benchmarks (OpenCL, gpu, {{matrix}})"
    key: "bench-opencl-gpu"
    # GPU timings must not compete with sibling benchmark shards.
    concurrency: 1
    concurrency_group: "dagger-gpu-benchmarks-opencl"
    if: build.message !~ /\[skip tests\]/ && build.message !~ /\[skip benchmarks\]/ && (build.pull_request.id != null || build.message =~ /\[run benchmarks\]/)
    depends_on: [test-opencl]
    timeout_in_minutes: 120
    matrix: [array, linalg, sparse, stencil]
    plugins:
      - JuliaCI/julia#v1:
          version: "1.11"
    agents:
      queue: "juliaecosystem"
      os: "macos"
      arch: "aarch64"
    command: "bash .buildkite/run_gpu_benchmarks.sh {{{{matrix}}}}"
    env:
      BENCHMARK_GPU: "opencl"
      BENCHMARK_VARIANT: "gpu"
      BENCHMARK_TEST_STEPS: "test-opencl"
      BENCHMARK_CI_THREADS: "2"
      OPENBLAS_NUM_THREADS: "1"
      BENCHMARK_SCALE: "[256, 1024]"
      BENCHMARK_BLOCKSIZE: "[128, 512]"
      BENCHMARK_SECONDS: "30"
      BENCHMARK_SAMPLES: "5"
      BENCHMARK_REGRESSION_THRESHOLD: "0.35"
      BENCHMARK_OUTPUT_DIR: "benchmark-results-opencl-gpu-{{matrix}}"
    artifacts:
      - "benchmark-results-*/**/*"

  - label: "Benchmarks (OpenCL, gpu-distributed, {{matrix}})"
    key: "bench-opencl-gpu-distributed"
    # GPU timings must not compete with sibling benchmark shards.
    concurrency: 1
    concurrency_group: "dagger-gpu-benchmarks-opencl"
    if: build.message !~ /\[skip tests\]/ && build.message !~ /\[skip benchmarks\]/ && (build.pull_request.id != null || build.message =~ /\[run benchmarks\]/)
    depends_on: [test-opencl]
    timeout_in_minutes: 120
    matrix: [array, linalg, sparse, stencil]
    plugins:
      - JuliaCI/julia#v1:
          version: "1.11"
    agents:
      queue: "juliaecosystem"
      os: "macos"
      arch: "aarch64"
    command: "bash .buildkite/run_gpu_benchmarks.sh {{{{matrix}}}}"
    env:
      BENCHMARK_GPU: "opencl"
      BENCHMARK_VARIANT: "gpu-distributed"
      BENCHMARK_TEST_STEPS: "test-opencl"
      BENCHMARK_CI_THREADS: "2"
      OPENBLAS_NUM_THREADS: "1"
      BENCHMARK_SCALE: "[256, 1024]"
      BENCHMARK_BLOCKSIZE: "[128, 512]"
      BENCHMARK_SECONDS: "30"
      BENCHMARK_SAMPLES: "5"
      BENCHMARK_REGRESSION_THRESHOLD: "0.35"
      BENCHMARK_OUTPUT_DIR: "benchmark-results-opencl-gpu-distributed-{{matrix}}"
      BENCHMARK_PROCS: "1:2"
    artifacts:
      - "benchmark-results-*/**/*"

  - label: "Benchmarks (OpenCL, gpu-mpi, {{matrix}})"
    key: "bench-opencl-gpu-mpi"
    # GPU timings must not compete with sibling benchmark shards.
    concurrency: 1
    concurrency_group: "dagger-gpu-benchmarks-opencl"
    if: build.message !~ /\[skip tests\]/ && build.message !~ /\[skip benchmarks\]/ && (build.pull_request.id != null || build.message =~ /\[run benchmarks\]/)
    depends_on: [test-opencl, test-opencl-mpi]
    timeout_in_minutes: 120
    matrix: [array, linalg, sparse, stencil]
    plugins:
      - JuliaCI/julia#v1:
          version: "1.11"
    agents:
      queue: "juliaecosystem"
      os: "macos"
      arch: "aarch64"
    command: "bash .buildkite/run_gpu_benchmarks.sh {{{{matrix}}}}"
    env:
      BENCHMARK_GPU: "opencl"
      BENCHMARK_VARIANT: "gpu-mpi"
      BENCHMARK_TEST_STEPS: "test-opencl,test-opencl-mpi"
      BENCHMARK_CI_THREADS: "2"
      OPENBLAS_NUM_THREADS: "1"
      BENCHMARK_SCALE: "[256, 1024]"
      BENCHMARK_BLOCKSIZE: "[128, 512]"
      BENCHMARK_SECONDS: "30"
      BENCHMARK_SAMPLES: "5"
      BENCHMARK_REGRESSION_THRESHOLD: "0.35"
      BENCHMARK_OUTPUT_DIR: "benchmark-results-opencl-gpu-mpi-{{matrix}}"
      BENCHMARK_MPI_RANKS: "2"
    artifacts:
      - "benchmark-results-*/**/*"

  - label: "GPU benchmark summary"
    key: opencl-benchmark-report
    if: build.message !~ /\[skip tests\]/ && build.message !~ /\[skip benchmarks\]/ && (build.pull_request.id != null || build.message =~ /\[run benchmarks\]/)
    depends_on: [bench-opencl-gpu, bench-opencl-gpu-distributed, bench-opencl-gpu-mpi]
    allow_dependency_failure: true
    timeout_in_minutes: 10
    agents:
      queue: "juliaecosystem"
      os: linux
      arch: x86_64
    env:
      BENCHMARK_GPU_VENDORS: "opencl"
    concurrency: 1
    concurrency_group: "dagger-gpu-benchmark-comments"
    command: "python3 -m unittest discover -s .buildkite -p 'test_*.py' && bash .buildkite/report_gpu_benchmarks.sh"
