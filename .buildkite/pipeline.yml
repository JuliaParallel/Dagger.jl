  - label: "GPU benchmark summary (cuda)"
    key: gpu-benchmark-report-cuda
    if: build.message !~ /\[skip tests\]/ && build.message !~ /\[skip benchmarks\]/ && (build.pull_request.labels includes "benchmarks" || build.message =~ /\[run benchmarks\]/)
    depends_on: [bench-cuda-gpu, bench-cuda-gpu-distributed, bench-cuda-gpu-mpi]
    allow_dependency_failure: true
    timeout_in_minutes: 10
    agents:
      queue: "upload"
      os: linux
      arch: x86_64
    env:
      BENCHMARK_GPU_VENDORS: "cuda,rocm,oneapi,metal"
    concurrency: 1
    concurrency_group: "dagger-gpu-benchmark-comments"
    command: "python3 -m unittest discover -s .buildkite -p 'test_*.py' && bash .buildkite/report_gpu_benchmarks.sh"
  - label: "GPU benchmark summary (rocm)"
    key: gpu-benchmark-report-rocm
    if: build.message !~ /\[skip tests\]/ && build.message !~ /\[skip benchmarks\]/ && (build.pull_request.labels includes "benchmarks" || build.message =~ /\[run benchmarks\]/)
    depends_on: [bench-rocm-gpu, bench-rocm-gpu-distributed, bench-rocm-gpu-mpi]
    allow_dependency_failure: true
    timeout_in_minutes: 10
    agents:
