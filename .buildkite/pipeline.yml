# The GPU benchmarks occupy the shared GPU runners for a long time, so they only run when
# requested, by labeling the pull request `benchmarks` or by putting `[run benchmarks]` in
# the commit message. Buildkite does not start a build when a label is added, so push a
# commit (an empty one is enough) after labeling.

  - label: "Benchmarks (CUDA, gpu, {{matrix}})"
    key: "bench-cuda-gpu"
    # GPU timings must not compete with sibling benchmark shards.
    concurrency: 1
    concurrency_group: "dagger-gpu-benchmarks-cuda"
    if: build.message !~ /\[skip tests\]/ && build.message !~ /\[skip benchmarks\]/ && (build.pull_request.labels includes "benchmarks" || build.message =~ /\[run benchmarks\]/)
    depends_on: [test-cuda]
    timeout_in_minutes: 120
    matrix: [array, linalg, sparse, stencil]
    plugins:
      - JuliaCI/julia#v1:
          version: "1.11"
    agents:
      queue: "cuda"
    command: "bash .buildkite/run_gpu_benchmarks.sh {{matrix}}"
    env:
      BENCHMARK_GPU: "cuda"
      BENCHMARK_VARIANT: "gpu"
      BENCHMARK_TEST_STEPS: "test-cuda"
      BENCHMARK_CI_THREADS: "2"
      OPENBLAS_NUM_THREADS: "1"
      BENCHMARK_SCALE: "[256, 1024]"
      BENCHMARK_BLOCKSIZE: "[128, 512]"
      BENCHMARK_SECONDS: "30"
      BENCHMARK_SAMPLES: "5"
      BENCHMARK_REGRESSION_THRESHOLD: "0.35"
      BENCHMARK_OUTPUT_DIR: "benchmark-results-cuda-gpu-{{matrix}}"
    artifacts:
      - "benchmark-results-*/**/*"

  - label: "Benchmarks (CUDA, gpu-distributed, {{matrix}})"
