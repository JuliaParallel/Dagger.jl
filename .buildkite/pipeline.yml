.gputest: &gputest
  timeout_in_minutes: 60
  if: build.message !~ /\[skip tests\]/
  command: "julia --project -e 'using Pkg; Pkg.develop(;path=\"lib/TimespanLogging\")'"

# MPI × GPU jobs launch the SPMD datadeps suite (test/mpi/<backend>.jl) under
# `mpiexec`. They use only the `julia` plugin (not `julia-test`, which would run
# the non-MPI `test/runtests.jl`), then instantiate the backend's MPI test env
# and drive it with `test/mpi/run.jl`, which uses MPI.jl's bundled `mpiexec`
# (no system MPI required). 2 ranks share whatever GPU(s) the agent exposes;
# the data plane is host-staged P2P, so a single device is sufficient.
.mpigputest: &mpigputest
  timeout_in_minutes: 60
  if: build.message !~ /\[skip tests\]/

steps:
  - label: Julia 1.11 (CUDA)
    key: test-cuda
    <<: *gputest
    plugins:
      - JuliaCI/julia#v1:
          version: "1.11"
      - JuliaCI/julia-test#v1: ~
      - JuliaCI/julia-coverage#v1:
          codecov: true
    agents:
      queue: "cuda"
    env:
      CI_USE_CUDA: "1"

  - label: Julia 1.11 (ROCm)
    key: test-rocm
    <<: *gputest
    plugins:
      - JuliaCI/julia#v1:
          version: "1.11"
      - JuliaCI/julia-test#v1: ~
      - JuliaCI/julia-coverage#v1:
          codecov: true
    agents:
      queue: "rocm"
    env:
      CI_USE_ROCM: "1"

  - label: Julia 1.11 (oneAPI)
    key: test-oneapi
    <<: *gputest
    plugins:
      - JuliaCI/julia#v1:
          version: "1.11"
      - JuliaCI/julia-test#v1: ~
      - JuliaCI/julia-coverage#v1:
          codecov: true
    agents:
      queue: "oneapi"
    env:
      CI_USE_ONEAPI: "1"

  - label: Julia 1.11 (Metal)
    key: test-metal
    timeout_in_minutes: 20
    <<: *gputest
    plugins:
      - JuliaCI/julia#v1:
          version: "1.11"
      - JuliaCI/julia-test#v1: ~
      - JuliaCI/julia-coverage#v1:
          codecov: true
    agents:
      queue: "metal"
    env:
      CI_USE_METAL: "1"

  - label: Julia 1.11 (CUDA, MPI)
    key: test-cuda-mpi
    <<: *mpigputest
    plugins:
      - JuliaCI/julia#v1:
          version: "1.11"
    agents:
      queue: "cuda"
    command: |
      julia --project=test/cudaenv -e 'using Pkg; Pkg.develop([PackageSpec(path=pwd()), PackageSpec(path="lib/TimespanLogging")]); Pkg.instantiate()'
      julia --project=test/cudaenv test/mpi/run.jl 2 2 test/mpi/cuda.jl

  - label: Julia 1.11 (ROCm, MPI)
    key: test-rocm-mpi
    <<: *mpigputest
    plugins:
      - JuliaCI/julia#v1:
          version: "1.11"
    agents:
      queue: "rocm"
    command: |
      julia --project=test/rocmenv -e 'using Pkg; Pkg.develop([PackageSpec(path=pwd()), PackageSpec(path="lib/TimespanLogging")]); Pkg.instantiate()'
      julia --project=test/rocmenv test/mpi/run.jl 2 2 test/mpi/rocm.jl

  # Disabled: has failed on every build since at least 2026-09-16, including on master (e.g.
  # ZE_RESULT_ERROR_INVALID_ARGUMENT and "Non-uniform value" errors in the dense matvec tests).
  # Re-enable once test/mpi/oneapi.jl passes.
