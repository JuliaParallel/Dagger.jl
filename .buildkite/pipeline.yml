.gputest: &gputest
  timeout_in_minutes: 60
  if: build.message !~ /\[skip tests\]/
  command: "julia --project -e 'using Pkg; Pkg.develop(;path=\"lib/TimespanLogging\")'"

# MPI × GPU jobs launch the SPMD datadeps suite (test/mpi_<backend>.jl) under
# `mpiexec`. They use only the `julia` plugin (not `julia-test`, which would run
# the non-MPI `test/runtests.jl`), then instantiate the backend's MPI test env
# and drive it with `test/run_mpi.jl`, which uses MPI.jl's bundled `mpiexec`
# (no system MPI required). 2 ranks share whatever GPU(s) the agent exposes;
# the data plane is host-staged P2P, so a single device is sufficient.
.mpigputest: &mpigputest
  timeout_in_minutes: 60
  if: build.message !~ /\[skip tests\]/

steps:
  - label: Julia 1.11 (CUDA)
    key: test-cuda
    <<: *gputest
    plugins:
      - JuliaCI/julia#v1:
          version: "1.11"
      - JuliaCI/julia-test#v1: ~
      - JuliaCI/julia-coverage#v1:
          codecov: true
    agents:
      queue: "cuda"
    env:
      CI_USE_CUDA: "1"

  - label: Julia 1.11 (ROCm)
    key: test-rocm
    <<: *gputest
    plugins:
      - JuliaCI/julia#v1:
          version: "1.11"
      - JuliaCI/julia-test#v1: ~
      - JuliaCI/julia-coverage#v1:
          codecov: true
    agents:
      queue: "rocm"
    env:
      CI_USE_ROCM: "1"

  - label: Julia 1.11 (oneAPI)
    key: test-oneapi
    <<: *gputest
    plugins:
      - JuliaCI/julia#v1:
          version: "1.11"
      - JuliaCI/julia-test#v1: ~
      - JuliaCI/julia-coverage#v1:
          codecov: true
    agents:
      queue: "oneapi"
    env:
      CI_USE_ONEAPI: "1"

  - label: Julia 1.11 (Metal)
    key: test-metal
    timeout_in_minutes: 20
    <<: *gputest
    plugins:
      - JuliaCI/julia#v1:
          version: "1.11"
      - JuliaCI/julia-test#v1: ~
      - JuliaCI/julia-coverage#v1:
          codecov: true
    agents:
      queue: "metal"
    env:
      CI_USE_METAL: "1"

  - label: Julia 1.11 (CUDA, MPI)
    key: test-cuda-mpi
    <<: *mpigputest
    plugins:
      - JuliaCI/julia#v1:
          version: "1.11"
    agents:
      queue: "cuda"
    command: |
      julia --project=test/cudaenv -e 'using Pkg; Pkg.develop([PackageSpec(path=pwd()), PackageSpec(path="lib/TimespanLogging")]); Pkg.instantiate()'
      julia --project=test/cudaenv test/run_mpi.jl 2 2 test/mpi_cuda.jl

  - label: Julia 1.11 (ROCm, MPI)
    key: test-rocm-mpi
    <<: *mpigputest
    plugins:
      - JuliaCI/julia#v1:
          version: "1.11"
    agents:
      queue: "rocm"
    command: |
      julia --project=test/rocmenv -e 'using Pkg; Pkg.develop([PackageSpec(path=pwd()), PackageSpec(path="lib/TimespanLogging")]); Pkg.instantiate()'
      julia --project=test/rocmenv test/run_mpi.jl 2 2 test/mpi_rocm.jl

  - label: Julia 1.11 (oneAPI, MPI)
    key: test-oneapi-mpi
    <<: *mpigputest
    plugins:
      - JuliaCI/julia#v1:
          version: "1.11"
    agents:
      queue: "oneapi"
    command: |
      julia --project=test/oneapienv -e 'using Pkg; Pkg.develop([PackageSpec(path=pwd()), PackageSpec(path="lib/TimespanLogging")]); Pkg.instantiate()'
      julia --project=test/oneapienv test/run_mpi.jl 2 2 test/mpi_oneapi.jl

  - label: Julia 1.11 (Metal, MPI)
    key: test-metal-mpi
    <<: *mpigputest
    timeout_in_minutes: 20
    plugins:
      - JuliaCI/julia#v1:
          version: "1.11"
    agents:
      queue: "metal"
    command: |
      julia --project=test/metalenv -e 'using Pkg; Pkg.develop([PackageSpec(path=pwd()), PackageSpec(path="lib/TimespanLogging")]); Pkg.instantiate()'
      julia --project=test/metalenv test/run_mpi.jl 2 2 test/mpi_metal.jl

  - label: Julia 1.11 (Finch)
    timeout_in_minutes: 90
    if: build.message !~ /\[skip tests\]/
    plugins:
      - JuliaCI/julia#v1:
          version: "1.11"
      - JuliaCI/julia-test#v1: ~
      - JuliaCI/julia-coverage#v1:
          codecov: true
    env:
      CI_TEST_FINCH: "1"

# env:
#   SECRET_CODECOV_TOKEN: ""

  - label: "Benchmarks (CUDA, gpu, {{matrix}})"
    key: "bench-cuda-gpu"
    # GPU timings must not compete with sibling benchmark shards.
    concurrency: 1
    concurrency_group: "dagger-gpu-benchmarks-cuda"
    if: build.message !~ /\[skip tests\]/ && build.message !~ /\[skip benchmarks\]/ && (build.pull_request.id != null || build.message =~ /\[run benchmarks\]/)
    depends_on: [test-cuda]
    timeout_in_minutes: 120
    matrix: [array, linalg, sparse, stencil]
    plugins:
      - JuliaCI/julia#v1:
          version: "1.11"
    agents:
      queue: "cuda"
    command: "bash .buildkite/run_gpu_benchmarks.sh {{{{matrix}}}}"
    env:
      BENCHMARK_GPU: "cuda"
      BENCHMARK_VARIANT: "gpu"
      BENCHMARK_TEST_STEPS: "test-cuda"
      BENCHMARK_CI_THREADS: "2"
      OPENBLAS_NUM_THREADS: "1"
      BENCHMARK_SCALE: "[256, 1024]"
      BENCHMARK_BLOCKSIZE: "[128, 512]"
      BENCHMARK_SECONDS: "30"
      BENCHMARK_SAMPLES: "5"
      BENCHMARK_REGRESSION_THRESHOLD: "0.35"
      BENCHMARK_OUTPUT_DIR: "benchmark-results-cuda-gpu-{{matrix}}"
    artifacts:
      - "benchmark-results-*/**/*"

